# Custom secret rules, on top of Trivy's builtins. The builtins know
# cloud-vendor token formats and the age identity, but the other
# secrets this repo actually holds — a WireGuard key, 32-hex *arr API
# keys, a Plex claim — match none of them, so without these rules the
# scan passes on exactly the leaks that matter here. Anchored on key
# names so the SOPS-encrypted `KEY=ENC[...]` values in
# secrets/*.enc.env can never match. Verified by planting each format
# and watching it fire — do the same for any rule added here, and keep
# "test" out of the planted filename: Trivy's builtin allow-rules skip
# test-looking paths, which silently passes the plant.
rules:
  - id: wireguard-private-key
    category: general
    title: WireGuard private key
    severity: CRITICAL
    regex: (?i)wireguard[_-]?private[_-]?key\s*[=:]\s*['"]?[A-Za-z0-9+/]{43}=

  - id: arr-api-key
    category: general
    title: Servarr-style 32-hex API key
    severity: HIGH
    regex: (?i)api[_-]?key\s*[=:]\s*['"]?[0-9a-f]{32}\b

  - id: plex-claim-token
    category: general
    title: Plex claim token
    severity: HIGH
    regex: claim-[A-Za-z0-9_-]{20}
