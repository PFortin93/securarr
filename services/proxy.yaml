# Ingress. Two ways in, deliberately different:
#
#   Plex              Its own port forward and its own TLS, hardened at
#                     the router (geo block / IDS if your edge offers
#                     them). Not in Caddy's external path, and not behind
#                     Access — native clients (Apple TV, Roku, phones)
#                     cannot complete a browser auth flow.
#   Everything else   Cloudflare tunnel into Caddy, with Access policies
#                     in front. Users reach Seerr with a one-time PIN
#                     emailed to them; no Cloudflare account needed.
#
# There is NO port forward to this proxy. Nothing here answers the
# internet directly, which is why the Caddyfile can guard every single
# hostname rather than carving out exceptions.

services:
  caddy:
    # Stock Caddy has no DNS providers compiled in. This build adds the
    # Cloudflare plugin, which is what makes DNS-01 possible.
    image: ghcr.io/caddybuilds/caddy-cloudflare:2.11.4@sha256:62639363ceb043393da9c3895d7c97a9a49ccf840bea0cc7e6479465d12ade96
    container_name: caddy
    environment:
      - DOMAIN=${DOMAIN}
      - REMOTE_DOMAIN=${REMOTE_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
      - PLEX_HOST=${PLEX_HOST}
    # CLOUDFLARE_API_TOKEN lives here — see secrets/caddy.env.example
    env_file:
      - secrets/caddy.env
    # Deliberately its own variable, not the apps' BIND_ADDRESS. With
    # BIND_ADDRESS=127.0.0.1 the apps are reachable only through this
    # proxy — which only works if the proxy itself stays bound to the LAN.
    ports:
      - ${PROXY_BIND_ADDRESS}:80:80
      - ${PROXY_BIND_ADDRESS}:443:443
      - ${PROXY_BIND_ADDRESS}:443:443/udp   # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates live here. Losing this means re-issuing
      # everything, so it must survive container recreation.
      - ${CONFIG_DIRECTORY}/caddy/data:/data
      - ${CONFIG_DIRECTORY}/caddy/config:/config
    # Lets the Plex block reach the host, for the single-host layout
    # where PLEX_HOST=host.docker.internal (Plex uses host networking).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - securarr

  # Cloudflare ZTNA agent. Dials out to Cloudflare and holds the
  # connection open — no inbound port, nothing forwarded at the router.
  #
  # It does no routing of its own: every hostname is pointed at Caddy in
  # the tunnel's public-hostname config, and Caddy does the per-app
  # routing it already does. One place for routes, not two.
  #
  # Because it reaches Caddy from inside the Docker network, its source
  # address is private — which is what the guard in the Caddyfile keys
  # on. Tunnel traffic passes it; anything arriving from a public source
  # address does not, which is the backstop if a forward ever appears.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3@sha256:51c9cefcb4569df44e1ad403ab1d3d8065aa8e84339bcfc6aee75502e1140339
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    # TUNNEL_TOKEN lives here — see secrets/cloudflared.env.example
    env_file:
      - secrets/cloudflared.env
    depends_on:
      - caddy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - securarr
