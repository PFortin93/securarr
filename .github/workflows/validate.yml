# Secrets are gitignored, so stand in empty files — `compose config`
# only needs them to exist.
name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Lint workflows
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12 -color
      - name: Audit workflows
        # zizmor's online audits (impostor commits, stale refs) need a
        # token; the default read-only one is enough.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" \
            ghcr.io/zizmorcore/zizmor:1.29.0 /repo/.github/workflows
      - name: Stub gitignored secret files
        run: for f in vpn arr-keys caddy cloudflared; do touch "secrets/$f.env"; done
      - name: Validate arr stack
        run: docker compose config --quiet
      - name: Validate plex stack
        run: docker compose -f compose.plex.yaml config --quiet
      - name: Validate Butane profiles
        run: |
          for f in host/butane-arr.yaml host/butane-plex.yaml; do
            docker run --rm -i quay.io/coreos/butane:release --strict < "$f" > /dev/null
          done
