# Self-hosted Renovate on a daily schedule. Needs the RENOVATE_TOKEN
# repo secret: a fine-grained PAT for this repo with Contents and
# Pull requests set to Read/Write.
name: renovate
on:
  schedule:
    - cron: '0 12 * * *'   # daily
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: info
